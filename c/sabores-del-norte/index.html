<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo</title>
<meta name="description" content="Catálogo digital con pedido directo por WhatsApp.">
<meta name="theme-color" content="#1a2558">
<link rel="icon" href="/img/asiria-favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../catalogo.css?v=3">
<script src="../catalogo.js?v=3" defer></script>
</head>
<body>
<a class="saltar" href="#contenido">Saltar a los productos</a>

<p class="aviso-demo" id="aviso-demo" hidden>Catálogo de <strong>ejemplo</strong> creado por Asiria. <a href="https://wa.me/51958736378?text=Hola%20Asiria%2C%20quiero%20mi%20cat%C3%A1logo%20digital">Quiero uno para mi negocio</a></p>

<header class="cabecera">
  <div class="envoltura">
    <div class="logo-negocio" id="logo-negocio" aria-hidden="true"></div>
    <div>
      <h1 id="nombre-negocio">Cargando…</h1>
      <p id="descripcion-negocio"></p>
    </div>
  </div>
  <div class="envoltura datos-negocio" id="datos-negocio"></div>
</header>

<main>
  <div class="envoltura">
    <div class="herramientas">
      <label class="oculto" for="buscador">Buscar productos</label>
      <input class="buscador" id="buscador" type="search" placeholder="Buscar en la carta…" autocomplete="off">
      <nav class="chips" id="chips" aria-label="Categorías"></nav>
    </div>
    <div id="contenido"></div>
    <p class="pie" id="firma">Catálogo digital hecho por <a href="/">Asiria</a> · Construyendo soluciones con IA</p>
  </div>
</main>

<div class="barra-pedido">
  <button type="button" id="ver-pedido" disabled>
    <span id="barra-texto">Elige tus productos</span>
    <span id="barra-total"></span>
  </button>
</div>
<p class="oculto" aria-live="polite" id="estado-pedido"></p>

<dialog id="ventana" aria-labelledby="titulo-pedido">
  <div class="dlg">
    <div class="dlg-cab">
      <h2 id="titulo-pedido">Tu pedido</h2>
      <button type="button" class="cerrar" id="cerrar" aria-label="Cerrar">✕</button>
    </div>
    <div id="lineas"></div>
    <div class="total"><span>Total</span><span id="total"></span></div>
    <fieldset>
      <legend>¿Cómo lo recibes?</legend>
      <div class="opciones">
        <label><input type="radio" name="entrega" value="Recojo en local" checked> Recojo</label>
        <label><input type="radio" name="entrega" value="Delivery"> Delivery</label>
      </div>
    </fieldset>
    <label class="campo" id="campo-direccion" hidden>Dirección de entrega
      <input id="direccion" type="text" autocomplete="street-address">
    </label>
    <label class="campo">Tu nombre (opcional)
      <input id="cliente" type="text" autocomplete="name">
    </label>
    <label class="campo">Notas (opcional)
      <textarea id="notas" rows="2" placeholder="Ej.: sin ají, para las 7 p. m."></textarea>
    </label>
    <a class="enviar" id="enviar" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
      Enviar pedido por WhatsApp
    </a>
    <p class="nota">Se abrirá WhatsApp con tu pedido listo. Solo presiona enviar.</p>
  </div>
</dialog>
</body>
</html>
